[project]
name = "bat-practice"
version = "0.1.0"
description = "Классификация echolocation calls летучих мышей (ViT LF-PE, BEATs)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "pytorch-lightning>=2.4",
    "tensorboard>=2.17",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "soundfile>=0.12",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
]

[tool.uv]
package = false
